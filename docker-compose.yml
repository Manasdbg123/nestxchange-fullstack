# =============================================================================
# Local full-stack environment: PostgreSQL + API + web client.
#
# Secrets come from a `.env` file next to this one (copy `.env.example`), so
# nothing sensitive is committed. `docker compose up` reads it automatically.
# =============================================================================

services:
  postgresdb:
    image: postgres:16
    container_name: nestxchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nestxchange}
      POSTGRES_USER: ${DB_USERNAME:-nestxchange}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The API used to start the instant the container existed and crash-loop
      # while Postgres was still initialising. depends_on now waits for readiness.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nestxchange} -d ${POSTGRES_DB:-nestxchange}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestxchange-api
    restart: unless-stopped
    depends_on:
      postgresdb:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgresdb:5432/${POSTGRES_DB:-nestxchange}
      DB_USERNAME: ${DB_USERNAME:-nestxchange}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

  web:
    build:
      context: ./nestxchange-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081/api/v1}
    container_name: nestxchange-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  postgres_data:
