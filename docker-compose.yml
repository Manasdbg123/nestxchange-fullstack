# =============================================================================
# Local full-stack environment: MySQL + API + web client.
#
# Secrets come from a `.env` file next to this one (copy `.env.example`), so
# nothing sensitive is committed. `docker compose up` reads it automatically.
# =============================================================================

services:
  mysqldb:
    image: mysql:8.0
    container_name: rentnest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rentnest}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in your .env}
      MYSQL_USER: ${DB_USERNAME:-rentnest}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # The API used to start the instant the container existed and crash-loop
      # while MySQL was still initialising. depends_on now waits for readiness.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentnest-api
    restart: unless-stopped
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE:-rentnest}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-rentnest}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your .env}
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

  web:
    build:
      context: ./rentnest-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081/api/v1}
    container_name: rentnest-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  mysql_data:
