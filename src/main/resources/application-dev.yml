# ---------------------------------------------------------------------------
# Development profile: verbose SQL, sample data seeding. Schema itself comes
# from Flyway migrations (see application.yml), not Hibernate ddl-auto.
# ---------------------------------------------------------------------------
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Dev-only fallback so `mvnw spring-boot:run` works out of the box.
    # JwtTokenProvider rejects this value under any other profile.
    secret: ${JWT_SECRET:dev-only-insecure-key-please-set-JWT_SECRET-in-your-env-file-0123456789abcdef}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:devpassword123}

logging:
  level:
    com.nestxchange: DEBUG
