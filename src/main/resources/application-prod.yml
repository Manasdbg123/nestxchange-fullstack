# ---------------------------------------------------------------------------
# Production profile.
#
# Schema is validated, never mutated - apply schema changes deliberately
# before deploying. Seeding is off and no SQL is logged.
# ---------------------------------------------------------------------------
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}

app:
  seed:
    enabled: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    com.nestxchange: INFO
