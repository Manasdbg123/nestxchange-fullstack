# ---------------------------------------------------------------------------
# NestXchange - base configuration.
#
# Every secret is read from the environment. Nothing sensitive is committed
# here; see `.env.example` for the full list of variables.
# ---------------------------------------------------------------------------
spring:
  application:
    name: nestxchange

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nestxchange}
    username: ${DB_USERNAME:nestxchange}
    password: ${DB_PASSWORD:}
    # Overridable so the app can be pointed at another engine (an in-memory H2
    # for a demo or an integration test) without editing this file.
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: NestXchangePool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    # Flyway owns the schema; Hibernate only validates that the entities agree
    # with what the migrations created instead of mutating tables at boot.
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  # Used to build absolute URLs for locally-stored images (the no-Cloudinary
  # fallback in CloudinaryServiceImpl) - irrelevant once Cloudinary is set up.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:${server.port}}
  # The deployed frontend origin - used to build the link inside a
  # password-reset email. Not the same as cors.allowed-origins, which can
  # list more than one origin; this is specifically "where should the link
  # in an outbound email point."
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:300}
  email:
    # Resend's API. api-key is deliberately left blank here - with none set,
    # ResendEmailServiceImpl logs the email instead of sending it (see its
    # own doc comment), so password reset still works end-to-end in local
    # dev without a real account.
    api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:NestXchange <onboarding@resend.dev>}
  upload:
    local-dir: ${UPLOAD_LOCAL_DIR:uploads}
  jwt:
    # HS512 requires >= 64 bytes of key material. The application refuses to
    # start if this is left blank or at a placeholder outside the dev profile.
    secret: ${JWT_SECRET:}
    expiration-milliseconds: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@nestxchange.local}
    admin-password: ${SEED_ADMIN_PASSWORD:}
  assistant:
    # Groq's chat-completions API is OpenAI-compatible, so no vendor SDK is
    # needed - see GroqChatClient. api-key is deliberately left blank here;
    # it's set in application-local.yml (gitignored) or the ASSISTANT_API_KEY
    # env var, never committed.
    api-key: ${ASSISTANT_API_KEY:}
    base-url: ${ASSISTANT_BASE_URL:https://api.groq.com/openai/v1}
    model: ${ASSISTANT_MODEL:llama-3.1-8b-instant}
    max-retrieved-listings: 5

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.nestxchange: ${LOG_LEVEL:INFO}
